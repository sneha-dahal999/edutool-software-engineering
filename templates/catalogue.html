<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Edutool.com Catalogue</title>
</head>
<body>
    <h1>Edutool.com E-Book Catalogue</h1>
    <p>Welcome, {{ username }}.</p>

    <form method="get" action="{{ url_for('catalogue') }}">
        <label>Search:
            <input type="text" name="q" value="{{ query }}" placeholder="Title, author or topic">
        </label>
        <button type="submit">Search</button>
    </form>

    <h2>Books</h2>
    {% if books %}
        <ul>
        {% for book in books %}
            <li>
                <strong>{{ book.title }}</strong> —
                {{ book.author }} ({{ book.topic }})
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <p>No matching books found.</p>
    {% endif %}

    <a href="{{ url_for('logout') }}">Logout</a>
</body>
</html>
